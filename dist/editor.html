<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主页内容编辑器 · Jin Zhu</title><link rel="stylesheet" href="style.css"><style>main{max-width:900px;padding:35px 25px;margin:auto}h1{font-size:30px}label{display:block;font-size:13px;margin:18px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #c8d0c1;border-radius:4px;background:white;color:#203a32;font:14px/1.7 Arial}textarea{min-height:100px}button,.action{padding:9px 16px;border:1px solid #abb99f;border-radius:4px;background:#e8edde;color:#203a32;font-size:13px;margin:8px 8px 8px 0}.item{padding:16px 0;border-bottom:1px solid #d9ded2}details{margin-top:20px}summary{font-size:18px}#status{font-size:13px}aside{font-size:14px;padding:18px;background:#e8edde}.toolbar{position:sticky;top:0;background:#f7f7f0;padding:10px 0;z-index:2}#import{width:auto;font-size:12px}.small{font-size:12px;color:#69736a}</style><main><a href="index.html">← 返回主页</a><h1>你的主页，轻松更新。</h1><aside>在这里修改内容，再下载 <b>content.json</b>，替换 GitHub 仓库中的同名文件。自动部署会更新主页。<a class="action" href="https://github.com/ZHUJin2002/ZHUJin2002.github.io/edit/master/content.json" target="_blank" rel="noopener">打开 GitHub 内容文件 ↗</a>此页面只在当前浏览器处理数据，<b>下载不会直接修改线上网站</b>。</aside><div class="toolbar"><button id="download">下载更新后的 content.json</button><button id="draft">保存浏览器草稿</button><span id="status" role="status"></span></div><label for="import">导入之前的 content.json（也可继续修改下方现有内容）</label><input type="file" id="import" accept="application/json,.json"><form id="form"></form><p class="small">简介与项目说明支持简单 HTML 链接。动态和论文每项对应一条；可用 &lt;strong&gt;、&lt;em&gt; 和 &lt;a href="…"&gt; 标记重点和链接。</p></main><script>
let data;const form=document.getElementById('form'),status=document.getElementById('status');const titles={name:'英文姓名',chineseName:'中文姓名',role:'身份 / 项目',institution:'学校',email:'邮箱',intro:'首页一句话介绍',about:'当前研究与导师',background:'教育背景',scholar:'Google Scholar 链接',orcid:'ORCID 链接',teaching:'教学经历',projects:'早期项目',education:'教育经历',experience:'实验室经历',honors:'荣誉与领导经历',skills:'技能',presentations:'学术报告'};const inputs={};
function render(){form.replaceChildren();Object.keys(inputs).forEach(k=>delete inputs[k]);for(const [key,title]of Object.entries(titles)){const label=document.createElement('label');label.textContent=title;label.htmlFor='field-'+key;const input=document.createElement(['about','background','teaching','projects','intro','education','experience','honors','skills','presentations'].includes(key)?'textarea':'input');input.id='field-'+key;input.value=data[key]||'';input.addEventListener('input',()=>{data[key]=input.value;status.textContent='有未下载的修改'});inputs[key]=input;form.append(label,input)}for(const [key,title]of [['news','新闻动态'],['publications','论文列表']]){const details=document.createElement('details');details.open=true;const summary=document.createElement('summary');summary.textContent=title;details.append(summary);data[key].forEach((text,index)=>{const item=document.createElement('div');item.className='item';const label=document.createElement('label');label.textContent=title+' '+(index+1);const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('aria-label',label.textContent);ta.addEventListener('input',()=>{data[key][index]=ta.value;status.textContent='有未下载的修改'});item.append(label,ta);for(const [caption,fn]of [['上移',()=>{if(index){[data[key][index-1],data[key][index]]=[data[key][index],data[key][index-1]];render()}}],['删除',()=>{data[key].splice(index,1);render()}]]){const b=document.createElement('button');b.type='button';b.textContent=caption;b.onclick=fn;item.append(b)}details.append(item)});const add=document.createElement('button');add.type='button';add.textContent='＋ 添加'+title;add.onclick=()=>{data[key].unshift(key==='news'?'<strong>2026/11</strong> 在此填写动态':'作者. <strong>论文标题</strong>. <em>期刊</em>. <a href="https://doi.org/">DOI</a>');render()};details.append(add);form.append(details)}}
function validate(value){if(!value||typeof value!=='object'||!Array.isArray(value.news)||!Array.isArray(value.publications)||!value.news.every(x=>typeof x==='string')||!value.publications.every(x=>typeof x==='string')||Object.keys(titles).some(k=>typeof value[k]!=='string'))throw Error('文件结构不完整，请导入本项目的 content.json');return value}
document.getElementById('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='content.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='已下载，请替换仓库中的 content.json'};document.getElementById('draft').onclick=()=>{try{localStorage.setItem('jin-homepage-draft-cv2026',JSON.stringify(data));status.textContent='草稿已保存在此浏览器'}catch{status.textContent='浏览器无法保存，请下载文件'}};document.getElementById('import').onchange=async e=>{try{data=validate(JSON.parse(await e.target.files[0].text()));render();status.textContent='已导入'}catch(err){status.textContent=err.message}};async function init(){try{const saved=localStorage.getItem('jin-homepage-draft-cv2026');data=validate(saved?JSON.parse(saved):await(await fetch('content.json')).json());render();if(saved)status.textContent='已恢复浏览器草稿'}catch(err){status.textContent='请通过上方按钮导入 content.json 后编辑。'}}init();
</script></html>
